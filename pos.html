<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>هيبة · نظام المحاسبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Ubuntu:wght@500;700&display=swap">
<style>
/* Layout: a cashier counter — services to tap on one side, the live bill on the other, today's takings underneath. */
:root{
  --cement:#d5d3ce; --cement-2:#c9c6c0; --paper:#ecebe7; --seam:#aeaaa3; --stone:#66625d;
  --char:#262524; --char-2:#3b3936; --on-char:#e8e6e1; --ok:#2f7d4b; --warn:#8a3b26; --om-red:#b3322b;
  --f-display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-latin:"Ubuntu","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cement);color:var(--char);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(14px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--char);outline-offset:2px}
.num{font-family:var(--f-latin);font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.wrap{max-width:1180px;margin-inline:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--char);background:var(--char);color:var(--on-char);
  font-weight:600;padding:11px 20px;border-radius:999px;cursor:pointer;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--char-2)}
.btn.ghost{background:transparent;color:var(--char)}
.btn.ghost:hover{background:var(--char);color:var(--on-char)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.sm{padding:6px 14px;font-size:14px}

/* PIN gate */
.gate{min-height:100vh;display:grid;place-items:center;padding-block:24px}
.gate-card{width:min(380px,100%);background:var(--paper);border-radius:24px;padding:28px 24px;display:grid;gap:16px;text-align:center}
.gate-card .logo{width:120px;margin-inline:auto;display:block}
.gate-card h1{margin:0;font-family:var(--f-display);font-size:24px}
.gate-card p{margin:0;color:var(--stone);font-size:14px}
.pin{width:100%;text-align:center;font-family:var(--f-latin);font-size:30px;letter-spacing:.5em;padding:12px;border:1.5px solid var(--seam);border-radius:14px;background:#fff}
.pin:focus{border-color:var(--char);outline:none}
.err{color:var(--warn);font-size:14px;min-height:1.4em;margin:0}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--seam);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{width:58px;height:auto;flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-size:20px;line-height:1.2}
.brand small{display:block;color:var(--stone);font-size:12.5px;font-weight:500}
.today-chip{display:flex;align-items:center;gap:12px;background:var(--char);color:var(--on-char);border:0;border-radius:16px;padding:8px 16px;cursor:pointer;text-align:start}
.today-chip b{font-family:var(--f-latin);font-size:22px;line-height:1.1}
.today-chip small{display:block;opacity:.7;font-size:12px}
.head-actions{display:flex;gap:8px;align-items:center}

/* layout */
.pos{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;padding-block:18px;align-items:start}
.panel{background:var(--paper);border-radius:20px;padding:18px;min-width:0}
.panel h2{margin:0 0 12px;font-family:var(--f-display);font-size:18px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--stone)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1.5px solid var(--char);background:transparent;border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600;font-size:14px}
.tab[aria-selected="true"]{background:var(--char);color:var(--on-char)}
.tab.hot::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--om-red);margin-inline-end:6px;transform:translateY(-1px)}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.svc{display:grid;gap:2px;text-align:start;background:var(--cement);border:1.5px solid transparent;border-radius:14px;padding:10px 12px;cursor:pointer;min-height:76px;align-content:space-between;position:relative}
.svc:hover{border-color:var(--seam)}
.svc:active{transform:scale(.98)}
.svc .n{font-weight:600;font-size:14.5px;line-height:1.35}
.svc .p{font-family:var(--f-latin);font-weight:700;font-size:16px}
.svc .p small{font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--stone);margin-inline-start:3px}
.svc .p s{font-size:12px;color:var(--stone);font-weight:500;margin-inline-start:6px}
.svc .cnt{position:absolute;top:8px;left:8px;background:var(--char);color:var(--on-char);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-family:var(--f-latin);font-size:13px;padding-inline:6px}
.svc.custom{border:1.5px dashed var(--seam);background:transparent;place-content:center;text-align:center;font-weight:600}

/* bill */
.bill{position:sticky;top:12px;display:grid;gap:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;border:1.5px solid var(--char);background:transparent;border-radius:12px;padding:8px 10px;cursor:pointer;font-weight:600;font-size:14.5px}
.seg button[aria-pressed="true"]{background:var(--char);color:var(--on-char)}
.lab{font-size:13px;color:var(--stone);margin-bottom:6px;display:block}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field input,.field textarea{width:100%;background:#fff;border:1.5px solid var(--cement-2);border-radius:12px;padding:10px 12px}
.field input:focus,.field textarea:focus{border-color:var(--char);outline:none}
.field textarea{min-height:56px;resize:vertical}
.ltr-in{direction:ltr;text-align:right;font-family:var(--f-latin)}

.lines{display:grid;gap:6px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;background:#fff;border-radius:12px;padding:8px 10px}
.line .nm{font-weight:600;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.line .nm input{width:100%;border:0;border-bottom:1.5px dashed var(--seam);background:transparent;padding:2px 0;font-weight:600}
.qty{display:flex;align-items:center;border:1.5px solid var(--cement-2);border-radius:999px}
.qty button{border:0;background:transparent;width:28px;height:28px;cursor:pointer;font-size:18px;line-height:1}
.qty span{min-width:18px;text-align:center;font-family:var(--f-latin)}
.price{width:76px;text-align:center;border:1.5px solid var(--cement-2);border-radius:10px;padding:5px 4px;font-family:var(--f-latin);font-weight:700;background:var(--paper)}
.price:focus{border-color:var(--char);outline:none}
.rm{border:0;background:transparent;cursor:pointer;width:28px;height:28px;border-radius:50%;color:var(--stone);font-size:18px}
.rm:hover{background:var(--cement)}
.empty{color:var(--stone);text-align:center;padding:18px 8px;border:1.5px dashed var(--seam);border-radius:12px;font-size:14px}

.totals{display:grid;gap:6px;border-top:1px dashed var(--seam);padding-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px}
.row .disc{width:90px;text-align:center;border:1.5px solid var(--cement-2);border-radius:10px;padding:5px;font-family:var(--f-latin);background:#fff}
.grand{font-size:15px;font-weight:600}
.grand b{font-family:var(--f-latin);font-size:34px;line-height:1}
.grand small{font-size:14px;color:var(--stone);margin-inline-start:4px}
.save{width:100%;padding:14px;font-size:17px}
.done{background:var(--ok);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:600}
.done b{font-family:var(--f-latin)}

/* today */
.today{padding-bottom:30px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--cement);border-radius:14px;padding:10px 12px}
.stat small{display:block;color:var(--stone);font-size:12.5px}
.stat b{font-family:var(--f-latin);font-size:22px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{font-weight:600;color:var(--stone);font-size:12.5px;text-align:start;padding:8px;border-bottom:1px solid var(--seam)}
td{padding:9px 8px;border-bottom:1px solid var(--cement-2);vertical-align:top}
td.num{white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:600;background:var(--cement)}

.mbar{display:none}
@media (max-width:860px){
  .mbar{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--char);color:var(--on-char);
    padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
  .mbar[hidden]{display:none!important}
  .mbar b{font-family:var(--f-latin);font-size:22px}
  .mbar .btn{background:var(--on-char);color:var(--char);border-color:var(--on-char)}
  body.has-bar{padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
}
.toast{position:fixed;inset:auto 0 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--char);color:var(--on-char);text-align:center;font-weight:600;transform:translateY(110%);transition:transform .25s;z-index:30}
.toast.show{transform:none}
.toast.bad{background:var(--warn)}

@media (max-width:860px){
  .pos{grid-template-columns:1fr}
  .bill{position:static}
}
@media (max-width:460px){
  .fields{grid-template-columns:1fr}
  .line{grid-template-columns:auto 1fr auto;grid-template-areas:"nm nm nm" "qty pr rm"}
  .line .nm{grid-area:nm} .line .qty{grid-area:qty} .line .price{grid-area:pr;justify-self:start} .line .rm{grid-area:rm}
  .brand h1{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* ===== إعدادات ===== */
const API = "https://script.google.com/macros/s/AKfycbycDzO3xlN1xW-5yP4nvJb_9AD_ZhTYQSEZSZlYGL38x4PUf9a751hgtEdoOCTPhBvJ/exec";
const STAFF = ["الحلاق", "الموظف الثاني"];           // أسماء الموظفين
const PAYMENTS = ["نقداً", "بطاقة", "تحويل"];
const OFFERS_END = "2026-11-30";                       // آخر يوم لعروض العيد الوطني
const OFFERS_ON = new Date() <= new Date(OFFERS_END + "T23:59:59+04:00");

const CATS = [
  { key: "hair", label: "الشعر", items: [["قص شعر", 2], ["حلاقة اللحية", 1.5], ["هيد سبا مع بروتين", 30], ["حناء للشعر واللحية", 4], ["صبغة للشعر واللحية", 5], ["إزالة شعر الوجه بالخيط", 2], ["حمام زيت", 5]] },
  { key: "face", label: "الوجه", items: [["تنظيف بشرة سريع", 8], ["تنظيف بشرة عميق", 15], ["هيدرافيشل", 20], ["جولد هيدرافيشل", 30]] },
  { key: "nails", label: "الأظافر", items: [["مانيكير", 6], ["باديكير", 8], ["مانيكير وباديكير", 12], ["سبا القدمين مع باديكير", 15], ["باقة الأظافر السريعة", 8]] },
  { key: "body", label: "الجسم", items: [["حمام مغربي كلاسيكي", 10], ["الحمام المغربي الملكي", 15], ["ريفلكسولوجي القدمين", 8]] },
  { key: "packs", label: "الباقات", items: [["الباقة A", 35], ["الباقة B", 25], ["الباقة C", 25], ["الباقة D", 15], ["الباقة E", 30]].map(([n, p]) => [n, OFFERS_ON ? Math.round(p * .7 * 10) / 10 : p, OFFERS_ON ? p : null]) }
];
if (OFFERS_ON) CATS.unshift({ key: "nd", label: "عروض العيد الوطني", hot: true, items: [
  ["تنظيف الوجه العادي (عرض)", 6], ["تنظيف الوجه العميق (عرض)", 6], ["تنظيف المسام (عرض)", 6], ["مانيكير (عرض)", 6], ["باديكير (عرض)", 6],
  ["حمّام مغربي (عرض)", 6], ["تهذيب الشعر واللحية مع حمام زيت (عرض)", 6], ["سبا القدمين (عرض)", 6], ["سبا الرأس (عرض)", 6],
  ["مانيكير + باديكير (عرض)", 8], ["هايدرا فيشل (عرض)", 12]] });

/* ===== الحالة ===== */
const $ = id => document.getElementById(id);
const omr = v => String(Math.round((Number(v) || 0) * 1000) / 1000);
const st = { tab: CATS[0].key, lines: [], staff: null, pay: null, saving: false };
let PIN = "";
try { PIN = localStorage.getItem("haybah-pos-pin") || ""; } catch (e) {}
try { const s = localStorage.getItem("haybah-pos-staff"); if (STAFF.includes(s)) st.staff = s; } catch (e) {}

function toast(msg, bad) { const el = $("toast"); el.textContent = msg; el.classList.toggle("bad", !!bad); el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), bad ? 4500 : 2500); }

async function api(params, body) {
  const url = API + "?" + new URLSearchParams(params).toString();
  const r = body ? await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
                 : await fetch(url, { cache: "no-store" });
  return r.json();
}

/* ===== الدخول ===== */
$("gate-form").addEventListener("submit", async e => {
  e.preventDefault();
  const pin = $("pin").value.trim(); if (!pin) { $("pin-err").textContent = "اكتب الرقم السري."; return; }
  $("pin-go").disabled = true; $("pin-err").textContent = "";
  try {
    const j = await api({ action: "today", pin });
    if (j.ok) { PIN = pin; try { localStorage.setItem("haybah-pos-pin", pin); } catch (e) {} openApp(j); }
    else $("pin-err").textContent = j.reason === "pin" ? "الرقم السري غير صحيح." : "تعذّر الدخول، جرّب مرة ثانية.";
  } catch (err) { $("pin-err").textContent = "ما في اتصال بالإنترنت، أو الجدول غير جاهز."; }
  $("pin-go").disabled = false;
});
$("logout").onclick = () => { try { localStorage.removeItem("haybah-pos-pin"); } catch (e) {} PIN = ""; $("app").hidden = true; $("gate").hidden = false; $("pin").value = ""; $("pin").focus(); };

function openApp(today) { $("gate").hidden = true; $("app").hidden = false; renderAll(); renderToday(today); }

/* ===== الخدمات ===== */
function renderTabs() {
  const box = $("tabs"); box.innerHTML = "";
  CATS.forEach(c => {
    const b = document.createElement("button"); b.type = "button"; b.className = "tab" + (c.hot ? " hot" : ""); b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", st.tab === c.key); b.textContent = c.label;
    b.onclick = () => { st.tab = c.key; renderTabs(); renderGrid(); };
    box.appendChild(b);
  });
}
function renderGrid() {
  const box = $("grid"); box.innerHTML = "";
  CATS.find(c => c.key === st.tab).items.forEach(([name, price, was]) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "svc";
    const n = document.createElement("span"); n.className = "n"; n.textContent = name;
    const p = document.createElement("span"); p.className = "p"; p.textContent = omr(price);
    const sm = document.createElement("small"); sm.textContent = "ر.ع"; p.appendChild(sm);
    if (was) { const s = document.createElement("s"); s.textContent = was; p.appendChild(s); }
    b.append(n, p);
    const q = st.lines.filter(l => l.name === name).reduce((a, l) => a + l.qty, 0);
    if (q) { const c = document.createElement("span"); c.className = "cnt"; c.textContent = q; b.appendChild(c); }
    b.onclick = () => addLine(name, price);
    box.appendChild(b);
  });
  const c = document.createElement("button"); c.type = "button"; c.className = "svc custom"; c.textContent = "+ خدمة أخرى";
  c.onclick = () => { st.lines.push({ name: "", price: 0, qty: 1, custom: true }); $("done").hidden = true; renderLines(true); };
  box.appendChild(c);
}
function addLine(name, price) {
  const l = st.lines.find(x => x.name === name && !x.custom && x.price === price);
  if (l) l.qty++; else st.lines.push({ name, price, qty: 1 });
  $("done").hidden = true; renderLines(); renderGrid();
}

/* ===== الفاتورة ===== */
function seg(boxId, list, key, store) {
  const box = $(boxId); box.innerHTML = "";
  list.forEach(v => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = v; b.setAttribute("aria-pressed", st[key] === v);
    b.onclick = () => { st[key] = v; if (store) try { localStorage.setItem(store, v); } catch (e) {} seg(boxId, list, key, store); updateTotals(); };
    box.appendChild(b);
  });
}
function renderLines(focusLast) {
  const box = $("lines"); box.innerHTML = "";
  if (!st.lines.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "ما في خدمات بعد. اضغط على خدمة من القائمة."; box.appendChild(e); }
  st.lines.forEach((l, i) => {
    const row = document.createElement("div"); row.className = "line";
    const nm = document.createElement("div"); nm.className = "nm";
    if (l.custom) { const inp = document.createElement("input"); inp.value = l.name; inp.placeholder = "اسم الخدمة"; inp.setAttribute("aria-label", "اسم الخدمة"); inp.oninput = () => { l.name = inp.value; updateTotals(); }; nm.appendChild(inp); if (focusLast && i === st.lines.length - 1) queueMicrotask(() => inp.focus()); }
    else nm.textContent = l.name;
    const q = document.createElement("div"); q.className = "qty";
    const minus = document.createElement("button"); minus.type = "button"; minus.textContent = "−"; minus.setAttribute("aria-label", "إنقاص");
    const n = document.createElement("span"); n.textContent = l.qty;
    const plus = document.createElement("button"); plus.type = "button"; plus.textContent = "+"; plus.setAttribute("aria-label", "زيادة");
    minus.onclick = () => { if (l.qty > 1) l.qty--; else st.lines.splice(i, 1); renderLines(); renderGrid(); };
    plus.onclick = () => { l.qty++; renderLines(); renderGrid(); };
    q.append(minus, n, plus);
    const pr = document.createElement("input"); pr.className = "price"; pr.type = "number"; pr.inputMode = "decimal"; pr.min = "0"; pr.step = "0.5"; pr.value = l.price || ""; pr.placeholder = "0";
    pr.setAttribute("aria-label", "سعر " + (l.name || "الخدمة"));
    pr.oninput = () => { l.price = Math.max(0, parseFloat(pr.value) || 0); updateTotals(); };
    const rm = document.createElement("button"); rm.type = "button"; rm.className = "rm"; rm.textContent = "×"; rm.setAttribute("aria-label", "حذف");
    rm.onclick = () => { st.lines.splice(i, 1); renderLines(); renderGrid(); };
    row.append(nm, q, pr, rm); box.appendChild(row);
  });
  updateTotals();
}
const subTotal = () => st.lines.reduce((a, l) => a + l.price * l.qty, 0);
function updateTotals() {
  const sub = subTotal(), disc = Math.min(sub, Math.max(0, parseFloat($("disc").value) || 0));
  $("sub").textContent = omr(sub); $("total").textContent = omr(sub - disc);
  $("save").disabled = st.saving || !st.lines.length;
  const n = st.lines.reduce((a, l) => a + l.qty, 0), mob = matchMedia("(max-width:860px)").matches;
  $("mbar").hidden = !n; document.body.classList.toggle("has-bar", !!n);
  $("mbar-n").textContent = n === 1 ? "خدمة واحدة" : n === 2 ? "خدمتان" : n + " خدمات"; $("mbar-t").textContent = omr(sub - disc);
}
$("mbar-go") && ($("mbar-go").onclick = () => $("bill-h").scrollIntoView({ behavior: "smooth", block: "start" }));
$("disc").oninput = updateTotals;

$("save").onclick = async () => {
  const problems = [];
  if (!st.staff) problems.push("اختر الموظف");
  if (!st.pay) problems.push("اختر طريقة الدفع");
  if (st.lines.some(l => !l.name.trim())) problems.push("اكتب اسم الخدمة الإضافية");
  if (st.lines.some(l => !(l.price > 0))) problems.push("اكتب سعر كل خدمة");
  if (problems.length) { toast(problems.join(" · "), true); return; }
  const sub = subTotal(), disc = Math.min(sub, Math.max(0, parseFloat($("disc").value) || 0));
  const body = { action: "sale", pin: PIN, staff: st.staff, payment: st.pay,
    customer: $("c-name").value.trim(), phone: $("c-phone").value.trim(), note: $("note").value.trim(),
    items: st.lines.map(l => ({ name: l.name.trim(), price: l.price, qty: l.qty })), subtotal: omr(sub), discount: omr(disc), total: omr(sub - disc) };
  st.saving = true; updateTotals(); $("save").textContent = "جارٍ الحفظ…";
  try {
    const j = await api(null, body);
    if (j.ok) {
      $("done").innerHTML = ""; const s = document.createElement("span"); s.textContent = "✔ انحفظت الفاتورة ";
      const b = document.createElement("b"); b.textContent = j.invoice; const s2 = document.createElement("span"); s2.textContent = " · " + body.total + " ر.ع · ووصلت على الإيميل";
      $("done").append(s, b, s2); $("done").hidden = false;
      st.lines = []; st.pay = null; $("c-name").value = ""; $("c-phone").value = ""; $("note").value = ""; $("disc").value = "";
      renderAll(); if (j.today) renderToday(j.today);
      toast("انحفظت الفاتورة " + j.invoice);
    } else if (j.reason === "pin") { toast("الرقم السري تغيّر، سجّل الدخول مرة ثانية.", true); $("logout").click(); }
    else toast("ما انحفظت الفاتورة: " + (j.error || "خطأ غير معروف"), true);
  } catch (err) { toast("ما انحفظت الفاتورة. تأكد من الإنترنت وجرّب مرة ثانية، والفاتورة باقية كما هي.", true); }
  st.saving = false; $("save").textContent = "حفظ الفاتورة"; updateTotals();
};

/* ===== مبيعات اليوم ===== */
function renderToday(d) {
  if (!d) return;
  $("chip-total").textContent = omr(d.total); $("chip-count").textContent = d.count;
  const stats = $("stats"); stats.innerHTML = "";
  const cell = (label, val, unit) => { const c = document.createElement("div"); c.className = "stat"; const s = document.createElement("small"); s.textContent = label; const b = document.createElement("b"); b.textContent = val; c.append(s, b); if (unit) { const u = document.createElement("small"); u.style.display = "inline"; u.textContent = " " + unit; c.appendChild(u); } stats.appendChild(c); };
  cell("الإجمالي", omr(d.total), "ر.ع"); cell("الفواتير", d.count);
  PAYMENTS.forEach(p => cell(p, omr((d.byPay || {})[p] || 0), "ر.ع"));
  Object.entries(d.byStaff || {}).forEach(([k, v]) => cell(k, omr(v), "ر.ع"));
  const tb = $("rows"); tb.innerHTML = "";
  if (!d.sales.length) { const tr = document.createElement("tr"); const td = document.createElement("td"); td.colSpan = 7; td.textContent = "ما في فواتير اليوم بعد."; td.style.color = "var(--stone)"; tr.appendChild(td); tb.appendChild(tr); }
  d.sales.slice().reverse().forEach(x => {
    const tr = document.createElement("tr");
    [[x.invoice, "num"], [x.time, "num"], [x.customer || "—"], [x.services], [x.staff], [x.payment, "pill"], [omr(x.total) + " ر.ع", "num"]].forEach(([v, cls]) => {
      const td = document.createElement("td");
      if (cls === "pill") { const s = document.createElement("span"); s.className = "pill"; s.textContent = v; td.appendChild(s); } else { td.textContent = v; if (cls) td.className = cls; }
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
}
async function loadToday() { try { const j = await api({ action: "today", pin: PIN }); if (j.ok) renderToday(j); else if (j.reason === "pin") $("logout").click(); } catch (e) { toast("تعذّر تحديث مبيعات اليوم.", true); } }
$("refresh").onclick = loadToday;
$("chip").onclick = () => $("today").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth" });

function renderAll() {
  const now = new Date();
  $("today-date").textContent = now.toLocaleDateString("ar-OM", { weekday: "long", day: "numeric", month: "long" });
  renderTabs(); renderGrid(); renderLines(); seg("staff", STAFF, "staff", "haybah-pos-staff"); seg("pay", PAYMENTS, "pay");
}
setInterval(() => { $("bill-time").textContent = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }); }, 1000);
setInterval(() => { if (!$("app").hidden && !document.hidden) loadToday(); }, 60000);

/* دخول تلقائي لو الرقم محفوظ على هذا الجهاز */
if (PIN) api({ action: "today", pin: PIN }).then(j => { if (j.ok) openApp(j); else { PIN = ""; $("pin").focus(); } }).catch(() => { $("pin-err").textContent = "ما في اتصال بالإنترنت."; });
else $("pin").focus();
</script>
</body>
</html>
